version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      python-minor-patch:
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: /console/web
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      console-minor-patch:
        update-types: [minor, patch]
  - package-ecosystem: docker-compose
    directory: /deploy/docker
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      container-minor-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      actions-minor-patch:
        update-types: [minor, patch]
