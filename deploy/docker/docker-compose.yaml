# AgentStrata shared infrastructure that requires a container boundary.
#
# Thin stateless search adapters run in the AgentStrata process.  Compose keeps
# only substantial shared engines, browser-backed services, and account state.
# Every service is behind a profile, so a bare `docker compose up` starts none;
# deploy/docker/services.sh resolves enabled BotSpecs and reconciles desired state.

services:
  # ---------- SearXNG no-key web/image search engine -------------------------
  searxng:
    image: searxng/searxng:latest@sha256:f4c8e59de166ed71f6380c0847c312ca51f0d41996e31d0559163b6b09ecde52
    container_name: chatcopilot-searxng
    profiles: [search]
    init: true
    restart: unless-stopped
    volumes:
      - ./searxng/settings.yml:/etc/searxng/settings.yml:ro
      - searxng-data:/var/cache/searxng
    environment:
      SEARXNG_BASE_URL: "http://localhost:18064/"
    ports:
      - "127.0.0.1:18064:8080"
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,size=128m,mode=1777
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 512m
    cpus: 0.5
    networks: [searxng-egress]
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"

  # ---------- Xiaohongshu (browser-backed, account state, single concurrency)
  xiaohongshu-mcp:
    image: xpzouying/xiaohongshu-mcp:v1.2.6@sha256:59fa30292e0c994cb2267c2d16b4ec119af800287a735c7386de1cd9c755bc6d
    container_name: chatcopilot-xiaohongshu-mcp
    profiles: [experience]
    init: true
    tty: true
    restart: unless-stopped
    ports:
      - "127.0.0.1:18060:18060"
    volumes:
      - xiaohongshu-data:/app/data
      - xiaohongshu-cookies:/app/cookies
      - xiaohongshu-images:/app/images
    environment:
      COOKIES_PATH: /app/data/cookies.json
      HOME: /app/data/home
      XDG_CACHE_HOME: /app/data/cache
      XDG_CONFIG_HOME: /app/data/config
      XHS_PROXY: "${XHS_PROXY:-}"
    tmpfs:
      - /tmp:rw,exec,nosuid,nodev,size=512m,mode=1777
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    mem_limit: 2g
    cpus: 1.0
    networks: [xiaohongshu-egress]
    healthcheck:
      test: ["CMD-SHELL", "code=$$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:18060/mcp || true); echo \"$$code\" | grep -Eq '^(200|202|400|405)$'"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"

  # ---------- Playwright isolated dynamic-page reader ------------------------
  playwright-mcp:
    image: mcr.microsoft.com/playwright/mcp:v0.0.76@sha256:3108dac789720d5236ee1869ad65c8f32fbbfe9d7eea8a5eb89920ab35a665d6
    container_name: chatcopilot-playwright-mcp
    profiles: [browser]
    init: true
    user: "1000:1000"
    environment:
      HOME: /tmp
      XDG_CACHE_HOME: /tmp/playwright-cache
      XDG_CONFIG_HOME: /tmp/playwright-config
    entrypoint: ["node"]
    command:
      - /app/cli.js
      - --headless
      - --browser
      - chromium
      - --isolated
      - --block-service-workers
      - --image-responses
      - omit
      - --output-mode
      - stdout
      - --timeout-navigation
      - "30000"
      - --timeout-action
      - "5000"
      - --port
      - "8931"
      - --host
      - 0.0.0.0
      - --allowed-hosts
      - "127.0.0.1,localhost,127.0.0.1:18066,localhost:18066"
    ports:
      - "127.0.0.1:18066:8931"
    tmpfs:
      - /tmp:rw,exec,nosuid,nodev,size=512m,mode=1777
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    mem_limit: 1g
    cpus: 1.0
    networks: [playwright-egress]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8931/mcp',{headers:{Host:'localhost'}}).then(r=>process.exit(r.status<500?0:1)).catch(()=>process.exit(1))"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "30m"
        max-file: "3"

networks:
  searxng-egress:
  xiaohongshu-egress:
  playwright-egress:

volumes:
  searxng-data:
  xiaohongshu-data:
  xiaohongshu-cookies:
  xiaohongshu-images:
