servers:
  - id: github-readonly
    title: GitHub remote MCP (read-only policy in AgentStrata)
    source: curated
    source_url: https://github.com/github/github-mcp-server
    risk: readonly
    restart_required: true
    server:
      id: github
      enabled: true
      transport: streamable_http
      url: https://api.githubcopilot.com/mcp/
      headers:
        Authorization: "${GITHUB_MCP_AUTHORIZATION}"
      tool_prefix: github_
      exposure: subagent
      allowed_subagents:
        - mcp_query
      risk: readonly
      timeout_seconds: 30
      max_result_chars: 20000
    env_examples:
      GITHUB_MCP_AUTHORIZATION: Bearer <github-personal-access-token>
  - id: xiaohongshu-search
    title: Xiaohongshu search-only MCP
    source: curated
    source_url: https://github.com/xpzouying/xiaohongshu-mcp
    risk: search
    restart_required: true
    server:
      id: xiaohongshu
      enabled: true
      transport: streamable_http
      url: http://localhost:18060/mcp
      tool_prefix: xhs_
      exposure: subagent
      risk: search
      search_summary: "Search Xiaohongshu for lifestyle reviews, dining guides, travel tips, and user experiences through the search-only tool."
      search_domain_guidance: "Consumer experience source for first-hand lifestyle opinions. Use short keywords; do not pass field lists, instructions, or long natural-language objectives as the search keyword."
      timeout_seconds: 60
      max_result_chars: 8000
      max_concurrency: 1
      search_only_tools:
        - search_feeds
  - id: playwright-browser
    title: Playwright dynamic webpage reader
    source: curated
    source_url: https://github.com/microsoft/playwright-mcp
    risk: interactive
    restart_required: true
    server:
      id: playwright
      enabled: true
      transport: streamable_http
      url: http://localhost:18066/mcp
      exposure: subagent
      allowed_subagents:
        - browser_reader
      risk: interactive
      timeout_seconds: 30
      max_result_chars: 20000
      max_concurrency: 1
  - id: git-local
    title: Local Git repository operations (mcp-server-git)
    source: official
    source_url: https://github.com/modelcontextprotocol/servers/tree/main/src/git
    risk: write
    restart_required: false
    server:
      id: git
      enabled: true
      transport: stdio
      command: python
      args: ["-m", "mcp_server_git", "--repository", "${CHATCOPILOT_DEV_ROOT}"]
      tool_prefix: ""
      exposure: main
      allowed_subagents:
        - developer
      risk: write
      timeout_seconds: 30
      max_result_chars: 30000
