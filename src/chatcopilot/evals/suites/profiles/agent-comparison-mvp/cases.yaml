cases:
  - case_id: ifeval-json-format
    input: >-
      请只输出 JSON 对象，包含两个字段：name 和 value。不要输出 Markdown。
    category: instruction_following
    expected_behavior: Follow all verifiable instructions in the prompt.
    metadata:
      adapter: ifeval
      source: profile-snapshot-v1
      suite_id: ifeval
      instruction_checks:
        - id: detectable_format:json_object
          kwargs: {}
      level: "1"
      problem_categories: [detectable format]

  - case_id: gaia-smoke-arithmetic
    input: >-
      GAIA smoke task: What is 17 + 25? Reply with only the final answer.
    category: smoke
    expected_behavior: Return the concise final answer.
    metadata:
      adapter: gaia
      source: profile-snapshot-v1
      suite_id: gaia-smoke
      level: "1"
      answer: "42"

  - case_id: comparison-tool-lookup
    input: >-
      Use the lookup_eval_fact tool with key "comparison-token". Then reply with
      only the value returned by the tool. Do not guess the value.
    category: tool_orchestration
    expected_behavior: Call the permitted deterministic tool with the exact key and return its value.
    metadata:
      adapter: agent_comparison
      task_kind: tool
      source: profile-snapshot-v1
      suite_id: agent-comparison
      allowed_tools: [lookup_eval_fact]
      expected_tool: lookup_eval_fact
      expected_key: comparison-token
      expected_answer: paired-evidence

  - case_id: comparison-code-multiply
    input: >-
      The isolated repository contains calculator.py and test_calculator.py.
      Fix the multiply function so the tests pass. Inspect the files, make the
      smallest change, run the tests, and briefly state what changed.
    category: code
    expected_behavior: Repair the isolated fixture without touching files outside it.
    metadata:
      adapter: agent_comparison
      task_kind: code
      source: profile-snapshot-v1
      suite_id: agent-comparison
      allowed_tools: [read_file, edit_file, write_file, list_directory, search_content, run_command]
      fixture_files:
        calculator.py: |
          def multiply(left: int, right: int) -> int:
              return left + right
        test_calculator.py: |
          import unittest

          from calculator import multiply


          class CalculatorTests(unittest.TestCase):
              def test_multiply(self) -> None:
                  self.assertEqual(multiply(6, 7), 42)


          if __name__ == "__main__":
              unittest.main()
