cases:
- schema: agentstrata-eval-case/v1
  id: live2d-dialogue
  version: 1
  capability: application_bridge
  capability_tags:
  - 桥接
  - 执行证据
  plugin: application-bridge
  driver: agent_configured
  scenario_id: dialogue
  scenario_params:
    application: live2d
    expected_text: 桥接春风
  preset:
  - full
  - quick
  severity: required
  turns:
  - text: 本次对话的标记是“桥接春风”，请在后续对话中记住它。
  - text: 请给出刚才的标记。
  requirements:
    runtime_ids:
    - langgraph
    - codex
  policy:
    side_effect: isolated_write
    network: loopback
    timeout_seconds: 300
  judge:
    mode: all
    assertions:
    - kind: trusted_verifier
      id: application_bridge
      arguments: {}
    quality:
      enabled: false
      reason: 结构化运行、对端动作与回执足以判定桥接合同；不评开放语义。
      expected: 保留同一会话的标记并在后续回合返回；客户端或 provider 收到的内容与 Gateway 记录一致。
  metadata:
    test_category: task
