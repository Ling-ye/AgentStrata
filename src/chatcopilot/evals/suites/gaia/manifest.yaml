schema: 1
suite_id: gaia
version: 1.0.0
name: GAIA · 综合任务
subject_type: agent
capability_tags: [综合任务]
kind: agent
status: implemented
value: 真实世界多步任务，常需搜索、工具和综合推理，是 Agent 综合能力的标准标尺。
recommendation: Agent 机制或工具改动后运行；先用 Level 1 小样本，再跑 balanced-100 固定集。
cadence: weekly/release
plugin_id: gaia
driver_id: agent_configured
requires_bot: true
requires_external_data: true
prepare_supported: true
official_url: https://huggingface.co/datasets/gaia-benchmark/GAIA
setup_hint: >-
  设置 CHATCOPILOT_GAIA_DATA_PATH 指向官方 JSON/JSONL，可选
  CHATCOPILOT_GAIA_FILES_DIR/LEVELS/MAX_CASES/CASE_PROFILE；先用 Level 1
  小样本固定 search_information/Tavily 工具环境后再比较分数。
options:
  - name: dry_run
    type: boolean
    label: 仅校验，不调用模型
    default: false
  - name: llm_judge
    type: boolean
    label: 启用独立 LLM 附评
    default: false
  - name: scoring_mode
    type: enum
    label: 评分方案
    choices: [native, native_geval]
    default: native
  - name: quality_rubric
    type: enum
    label: GEval 量表
    choices: [evidence, task]
    default: evidence

source_type: public_benchmark
purpose: benchmark
data_version: 具体版本见题目数据快照；未提供时不推断
split: 实际载入数据划分
coverage: Level 1 / 2 / 3，以实际载入数据为准
target_scope: Agent runtime
native_method: GAIA 官方答案归一化匹配
scorer_origin: project_adapter
scorer_version: 1.0.0
execution_scope: agent_runtime
