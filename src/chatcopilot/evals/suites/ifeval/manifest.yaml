schema: 1
suite_id: ifeval
version: 1.0.0
name: IFEval
kind: safety
status: implemented
value: 指令遵循评测，检测格式、约束、角色和输出要求是否被正确执行。
recommendation: 每次改系统 prompt 后运行；外部数据默认 balanced-100，未配置时使用内置 smoke 子集。
cadence: daily/regression
plugin_id: ifeval
driver_id: agent_configured
requires_bot: true
requires_external_data: false
prepare_supported: true
official_url: https://github.com/google-research/google-research/tree/master/instruction_following_eval
setup_hint: >-
  可选：设置 CHATCOPILOT_IFEVAL_DATA_PATH 指向官方 input_data.jsonl；
  默认按指令复杂度映射 Level 并选 100 题。
options:
  - name: dry_run
    type: boolean
    label: 仅校验，不调用模型
    default: false
  - name: scoring_mode
    type: enum
    label: 评分方案
    choices: [native, native_geval]
    default: native
  - name: quality_rubric
    type: enum
    label: GEval 量表
    choices: [evidence, task]
    default: evidence

source_type: public_benchmark
purpose: benchmark
data_version: 具体版本见题目数据快照；未提供时不推断
split: 实际载入数据划分
coverage: 已实现的确定性指令类别
target_scope: Agent runtime
native_method: 指令约束检查（支持子集）
scorer_origin: project_adapter
scorer_version: 1.0.0
execution_scope: agent_runtime
