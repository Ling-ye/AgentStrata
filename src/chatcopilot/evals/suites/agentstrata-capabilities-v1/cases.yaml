  - schema: agentstrata-eval-case/v1
    id: search-general-with-evidence
    version: 2
    capability: search
    plugin: generic-agent
    driver: agent_configured
    preset: [quick, full]
    severity: required
    turns:
      - text: 使用 search_information 查询 Python 官方文档主题“pathlib.Path.resolve(strict=True) 在目标路径不存在时的行为”。调用时 objective 必须包含 pathlib.Path.resolve(strict=True)，source_hints 只设为 [web]，depth 设为 standard，verification 设为 none。给出简短结论，并至少列出一个实际返回结果的标题或链接作为证据；同一轮不要重复调用搜索工具。
    requirements:
      tools: [search_information]
    policy:
      side_effect: external_read
      network: configured
      allowed_tools: [search_information]
      required_tools: [search_information]
      timeout_seconds: 300
    judge:
      mode: all
      assertions:
        - kind: trusted_verifier
          id: search_answer_evidence
          arguments:
            objective_contains: pathlib.Path.resolve(strict=True)
            expected_source_hints: [web]
            expected_depth: standard
            expected_verification: none
            expected_route_source: script
            min_successful_results: 1
            require_deduplication: true
            require_source_reference: true
            external_fact_correctness: observational

  - schema: agentstrata-eval-case/v1
    id: search-explicit-source
    version: 2
    capability: search
    plugin: generic-agent
    driver: agent_configured
    preset: [full]
    severity: critical
    turns:
      - text: 仅使用小红书体验来源查询“上海 二郎拉面 探店”。调用 search_information 时 objective 必须包含“上海 二郎拉面 探店”，source_hints 只设为 [experience]，depth 设为 standard，verification 设为 none。不得用通用网页来源替代；给出找到的公开体验条目摘要，并至少列出一个实际返回结果的标题或链接；同一轮不要重复调用搜索工具。
    requirements:
      tools: [search_information]
    policy:
      side_effect: external_read
      network: configured
      allowed_tools: [search_information]
      required_tools: [search_information]
      timeout_seconds: 300
    judge:
      mode: all
      assertions:
        - kind: trusted_verifier
          id: explicit_source_trace
          arguments:
            objective_contains: 上海 二郎拉面 探店
            expected_source_hints: [experience]
            expected_depth: standard
            expected_verification: none
            expected_route_source: script
            min_successful_results: 1
            require_deduplication: true
            require_source_reference: true
            external_fact_correctness: observational

  - schema: agentstrata-eval-case/v1
    id: search-conflict-disclosure
    version: 1
    capability: search
    plugin: generic-agent
    driver: agent_configured
    preset: [full]
    severity: required
    turns:
      - text: 一次调用 search_information 比较“上海 二郎拉面 地址与评价”的网页资料和公开体验记录。调用时 objective 必须包含“上海 二郎拉面 地址与评价”，source_hints 按 [web, experience] 指定，depth 设为 thorough，verification 设为 required。基于 coordinator 返回的多来源、去重和 rerank 结果作答；若证据不一致或存在 gaps，明确说明冲突或未知项，并至少列出一个实际返回结果的标题或链接。
    requirements:
      tools: [search_information]
    policy:
      side_effect: external_read
      network: configured
      allowed_tools: [search_information]
      required_tools: [search_information]
      timeout_seconds: 300
    judge:
      mode: all
      assertions:
        - kind: trusted_verifier
          id: conflicting_evidence_disclosure
          arguments:
            objective_contains: 上海 二郎拉面 地址与评价
            expected_source_hints: [web, experience]
            expected_depth: thorough
            expected_verification: required
            expected_route_source: script
            min_successful_results: 2
            require_deduplication: true
            require_source_reference: true
            require_cross_check: true
            require_rerank: true
            external_fact_correctness: observational

