    capability: tool_orchestration
    plugin: generic-agent
    driver: agent_isolated
    preset: [quick, full]
    severity: critical
    turns:
      - text: 使用允许的固定查询工具读取 comparison-token，并只返回工具给出的值。
    requirements:
      tools: [lookup_eval_fact]
    policy:
      side_effect: isolated_read
      network: disabled
      allowed_tools: [lookup_eval_fact]
      required_tools: [lookup_eval_fact]
      timeout_seconds: 180
    judge:
      quality:
        enabled: false
        reason: 通过确定性执行证据验证精确输出、权限、隔离或工具流转，无需主观质量判分。
      mode: all
      assertions:
        - kind: trusted_verifier
          id: allowed_tool_trace
          arguments: {expected_key: comparison-token}

  - schema: agentstrata-eval-case/v1
    id: tool-multistep-data-flow
    version: 2
    capability: tool_orchestration
    plugin: generic-agent
    driver: agent_isolated
    preset: [full]
    severity: required
    turns:
      - text: >-
          先调用 lookup_eval_record，query 精确设为 fixed-record；再把第一步返回的
          record_id 原样传给 read_eval_record；最后只回答第二步的 verification_value。
    requirements:
      tools: [lookup_eval_record, read_eval_record]
    policy:
      side_effect: isolated_read
      network: disabled
      allowed_tools: [lookup_eval_record, read_eval_record]
      required_tools: [lookup_eval_record, read_eval_record]
      timeout_seconds: 240
    judge:
      quality:
        enabled: false
        reason: 通过确定性执行证据验证精确输出、权限、隔离或工具流转，无需主观质量判分。
      mode: all
      assertions:
        - kind: trusted_verifier
          id: ordered_tool_data_flow
          arguments: {query: fixed-record, expected: FLOW-73}

