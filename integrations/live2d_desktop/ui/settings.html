<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'">
<meta name="viewport" content="width=device-width,initial-scale=1"><title>AgentStrata Live2D · 连接设置</title>
<link rel="stylesheet" href="settings.css"></head><body><main>
<p class="eyebrow">AGENTSTRATA / LIVE2D</p><h1>让角色来到桌面</h1>
<p class="intro">连接本机 WSL 中独立安装的桌宠应用。角色和服务凭据继续保存在 WSL。</p>
<form id="settings"><label>WSL 发行版<select id="distro" required></select></label>
<label>应用安装目录<input id="root" placeholder="/home/你的用户名/AgentStrata-live2d" required></label>
<p class="hint">填写 app install 创建的目录，并先完成 app setup。角色生成器可按需安装。</p>
<div class="actions"><button type="submit" id="save">保存并连接</button><button type="button" id="connect" class="secondary">重新连接</button></div>
</form><p id="status" role="status" aria-live="polite">正在检查 WSL…</p>
<p class="hint">关闭角色窗口会隐藏到托盘。退出桌面程序后，后台与生成任务继续运行。</p>
</main><script src="settings.js"></script></body></html>
