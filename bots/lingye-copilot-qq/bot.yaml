id: lingye-copilot-qq
display_name: Lingye的AI助手

gateway:
  protocol_version: 1
  host: 127.0.0.1
  port_env: CHATCOPILOT_GATEWAY_PORT
  token_env: CHATCOPILOT_GATEWAY_TOKEN
  state_root_env: CHATCOPILOT_GATEWAY_STATE_ROOT

channels:
  qq:
    type: qq_personal
    provider: onebot_v11
    channel_id: qq
    endpoint_env: CHATCOPILOT_QQ_ONEBOT_WS_URL
    access_token_env: QQ_ACCESS_TOKEN
    account_env: QQ_ACCOUNT
    mention_only_groups: true

llm:
  chat:
    env_prefix: CHATCOPILOT_LINGYE
  research:
    env_prefix: CHATCOPILOT_LINGYE_RESEARCH
    model: gpt-5.6-terra
  code:
    enabled: true
    mode: rules
    model: gpt-5.6-terra
    reasoning_effort: medium
    profiles:
      sol-max:
        model: gpt-5.6-sol
        reasoning_effort: max
    code_task_profile: sol-max
    timeout_seconds: 21600
    allowed_roles: [owner]

prompts:
  schema_version: 2
  identity: prompts/identity.md
  response_style: prompts/response-style.md
  refusal_style: prompts/refusal-style.md
  role_styles:
    owner: prompts/roles/owner.md

tools:
  packs:
  - workspace.read_write
  - memory.chat
  - persona.control
  - playbooks.reader
  - mcp.admin
  - career.intelligence
  - wiki.knowledge
  - dev.code_tasks
  - filesystem.windows.read
  features:
  - chat.file_uploads
  - chat.image_inputs
  - chat.private_workspace
  mcp:
    servers: mcp/servers.yaml

agents:
  backend: codex
  codex:
    owner_access: worktree
    member_access: workspace
  unified_search:
    enabled: true
    providers:
      - id: tavily
        kind: tavily
        enabled: true
        endpoint: https://api.tavily.com/search
        credential_env: TAVILY_API_KEY
        timeout_seconds: 15
        max_results: 10
      - id: brave
        kind: brave
        enabled: false
        endpoint: https://api.search.brave.com/res/v1/web/search
        credential_env: BRAVE_API_KEY
        timeout_seconds: 15
        max_results: 10
      - id: searxng
        kind: searxng
        enabled: true
        endpoint: http://127.0.0.1:18064
        timeout_seconds: 20
        max_results: 10
context:
  wiki:
    enabled: true
    root_env: CHATCOPILOT_WIKI_ROOT
    label: private-wiki
    read_role: owner
    private_chat_only: true
    max_chunk_chars: 1200
  dev:
    root_env: CHATCOPILOT_DEV_ROOT
    allowed_paths:
      - "src/**"
      - "tests/**"
      - "console/**"
      - "scripts/**"
      - "specs/**"
      - "bots/**"
      - "docs/**"
      - "deploy/**"
      - ".codex/**"
      - ".cursor/**"
      - ".gitattributes"
      - ".gitignore"
      - "AGENTS.md"
      - "LICENSE"
      - "README.md"
      - "pyproject.toml"
      - "requirements.txt"
    denied_paths: ["**/local.env", "**/.env.*", "**/credentials*", "**/node_modules/**", "**/.git/**"]
    shell:
      timeout_default: 60
      timeout_max: 300
  memory_store:
    provider: markdown
    namespace: lingye-copilot-qq
    schema: memory/schema.yaml
  playbooks:
    manifest: skills/manifest.yaml

workspace:
  root_env: CHATCOPILOT_WORKSPACE_ROOT

deploy:
  target: wsl2
  instance_id: lingye-copilot-qq
  wsl_home: ~/ChatCopilot-lingye-copilot-qq
  workspace_root: ~/chatcopilot-workspaces/lingye-copilot-qq
  log_dir: ~/chatcopilot-logs/lingye-copilot-qq
  env_file: ~/.chatcopilot-lingye-copilot-qq.env
  project_name: chatcopilot-lingye-copilot-qq

packaging:
  allowlist: package.allowlist.yaml

access:
  owner_only_project_access: true
