id: lingye-copilot-qq
display_name: Lingye的AI助手

platform:
  type: qq
  adapter: qq_acp
  mention_name: Lingye的AI助手

llm:
  chat:
    env_prefix: CHATCOPILOT_LINGYE
  code:
    enabled: true
    mode: rules
    model: gpt-5.6-terra
    reasoning_effort: medium
    profiles:
      sol-max:
        model: gpt-5.6-sol
        reasoning_effort: max
    code_task_profile: sol-max
    timeout_seconds: 21600
    allowed_roles: [owner]

prompts:
  persona: prompts/persona.md
  refusal: prompts/refusal.md
  roles:
    owner: prompts/roles/owner.md

tools:
  packs:
  - workspace.read_write
  - memory.chat
  - persona.manage
  - playbooks.reader
  - mcp.admin
  - career.intelligence
  - wiki.knowledge
  - dev.code_tasks
  - filesystem.windows.read
  features:
  - chat.file_uploads
  - chat.image_inputs
  - chat.private_workspace
  mcp:
    servers: mcp/servers.yaml

agents:
  backend: codex
  codex:
    owner_access: worktree
    member_access: workspace
  unified_search:
    enabled: true
    providers:
      - id: tavily
        kind: tavily
        enabled: true
        endpoint: https://api.tavily.com/search
        credential_env: TAVILY_API_KEY
        timeout_seconds: 15
        max_results: 10
      - id: brave
        kind: brave
        enabled: false
        endpoint: https://api.search.brave.com/res/v1/web/search
        credential_env: BRAVE_API_KEY
        timeout_seconds: 15
        max_results: 10
      - id: searxng
        kind: searxng
        enabled: true
        endpoint: http://127.0.0.1:18064
        timeout_seconds: 20
        max_results: 10
context:
  wiki:
    enabled: true
    root_env: CHATCOPILOT_WIKI_ROOT
    label: private-wiki
    read_role: owner
    private_chat_only: true
    max_chunk_chars: 1200
  dev:
    root_env: CHATCOPILOT_DEV_ROOT
    allowed_paths:
      - "src/**"
      - "tests/**"
      - "console/**"
      - "scripts/**"
      - "specs/**"
      - "bots/**"
      - "docs/**"
      - "deploy/**"
      - ".codex/**"
      - ".cursor/**"
      - ".gitattributes"
      - ".gitignore"
      - "AGENTS.md"
      - "LICENSE"
      - "README.md"
      - "pyproject.toml"
      - "requirements.txt"
    denied_paths: ["**/local.env", "**/.env.*", "**/credentials*", "**/node_modules/**", "**/.git/**"]
    shell:
      timeout_default: 60
      timeout_max: 300
  memory_store:
    provider: markdown
    namespace: lingye-copilot-qq
    schema: memory/schema.yaml
  playbooks:
    manifest: skills/manifest.yaml

workspace:
  root_env: CHATCOPILOT_WORKSPACE_ROOT

deploy:
  target: wsl2
  instance_id: lingye-copilot-qq
  wsl_home: ~/ChatCopilot-lingye-copilot-qq
  workspace_root: ~/chatcopilot-workspaces/lingye-copilot-qq
  log_dir: ~/chatcopilot-logs/lingye-copilot-qq
  env_file: ~/.chatcopilot-lingye-copilot-qq.env
  cc_connect_config_dir: ~/.chatcopilot-runtime/lingye-copilot-qq/.cc-connect
  project_name: chatcopilot-lingye-copilot-qq

packaging:
  allowlist: package.allowlist.yaml

access:
  private_require_whitelist: true
  group_require_whitelist: true
  group_require_mention: true
  whitelist_env: QQ_ALLOW_FROM
