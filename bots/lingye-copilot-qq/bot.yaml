id: lingye-copilot-qq
display_name: Lingye的AI助手

gateway:
  protocol_version: 1
  host: 127.0.0.1
  port_env: CHATCOPILOT_GATEWAY_PORT
  token_env: CHATCOPILOT_GATEWAY_TOKEN
  state_root_env: CHATCOPILOT_GATEWAY_STATE_ROOT

channels:
  qq:
    type: qq_personal
    provider: onebot_v11
    channel_id: qq
    endpoint_env: CHATCOPILOT_QQ_ONEBOT_WS_URL
    access_token_env: QQ_ACCESS_TOKEN
    account_env: QQ_ACCOUNT
    mention_only_groups: true

workspace:
  root_env: CHATCOPILOT_WORKSPACE_ROOT

deploy:
  target: wsl2
  instance_id: lingye-copilot-qq
  wsl_home: ~/ChatCopilot-lingye-copilot-qq
  workspace_root: ~/chatcopilot-workspaces/lingye-copilot-qq
  log_dir: ~/chatcopilot-logs/lingye-copilot-qq
  env_file: ~/.chatcopilot-lingye-copilot-qq.env
  project_name: chatcopilot-lingye-copilot-qq

packaging:
  allowlist: package.allowlist.yaml
agent_profile: agent.yaml
