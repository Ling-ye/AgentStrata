id: desktop-reader
display_name: 读书助手
agent_profile: agent.yaml
gateway:
  port_env: CHATCOPILOT_GATEWAY_PORT
  state_root_env: CHATCOPILOT_GATEWAY_STATE_ROOT
  clients:
    - id: desktop-owner
      token_env: AGENTSTRATA_DESKTOP_GATEWAY_TOKEN
      role: owner
workspace:
  root_env: CHATCOPILOT_WORKSPACE_ROOT
deploy:
  target: windows
  instance_id: desktop-reader
