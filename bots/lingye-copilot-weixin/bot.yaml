id: lingye-copilot-weixin
display_name: Lingye的微信助手
gateway:
  protocol_version: 1
  host: 127.0.0.1
  port_env: CHATCOPILOT_GATEWAY_PORT
  token_env: CHATCOPILOT_GATEWAY_TOKEN
  state_root_env: CHATCOPILOT_GATEWAY_STATE_ROOT
channels:
  weixin:
    type: weixin_clawbot
    provider: ilink
    channel_id: weixin
    access_token_env: WEIXIN_BOT_TOKEN
    account_env: WEIXIN_BOT_ID
    user_env: WEIXIN_USER_ID
    endpoint_env: WEIXIN_API_BASE_URL
workspace:
  root_env: CHATCOPILOT_WORKSPACE_ROOT
deploy:
  target: wsl2
  instance_id: lingye-copilot-weixin
  wsl_home: ~/ChatCopilot-lingye-copilot-weixin
  workspace_root: ~/chatcopilot-workspaces/lingye-copilot-weixin
  log_dir: ~/chatcopilot-logs/lingye-copilot-weixin
  env_file: ~/.chatcopilot-lingye-copilot-weixin.env
  project_name: chatcopilot-lingye-copilot-weixin
packaging:
  allowlist: package.allowlist.yaml
agent_profile: agent.yaml
