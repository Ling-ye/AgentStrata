id: live2d-desktop
display_name: Live2D 桌面助手
agent_profile: agent.yaml
gateway:
  port_env: CHATCOPILOT_GATEWAY_PORT
  state_root_env: CHATCOPILOT_GATEWAY_STATE_ROOT
  clients:
    - id: avatar-owner
      token_env: AGENTSTRATA_AVATAR_GATEWAY_TOKEN
      role: owner
    - id: avatar-observer
      token_env: AGENTSTRATA_AVATAR_OBSERVER_TOKEN
      role: owner
      allowed_tools: [desktop_ObservePrimary]
workspace:
  root_env: CHATCOPILOT_WORKSPACE_ROOT
deploy:
  target: windows
  instance_id: live2d-desktop
